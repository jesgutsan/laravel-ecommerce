services:
  php:
    image: php:8.2-apache
    container_name: php_practicas
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y git zip unzip &&
      docker-php-ext-install pdo pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground
      "

  db:
    image: mysql:8.0
    container_name: mysql_practicas
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: botiga_laravel
      MYSQL_USER: dwes
      MYSQL_PASSWORD: abc123.
    ports:
      - "3306:3306"
    volumes:
      - ./botiga_laravel.sql:/docker-entrypoint-initdb.d/init.sql


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_practicas
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
